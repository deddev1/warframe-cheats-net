name = "warthunderhacks"
compatibility_date = "2026-01-01"

# Cloudflare Workers Builds runs only `npx wrangler deploy` by default.
# This build step creates ./dist before static assets are uploaded.
[build]
command = "node scripts/cloudflare-build.mjs"

# Old Pages-only key `pages_build_output_dir` is ignored there and caused:
# "Missing entry-point to Worker script or to assets directory"
[assets]
directory = "./dist"
not_found_handling = "404-page"
